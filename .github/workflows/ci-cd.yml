# Checks every push and pull request (the tests on the supported Pythons,
# ruff, the package build); a version tag (v1.2.3) publishes a GitHub release
# with the wheel and the source archive.
#
# The engine is a library: it isn't deployed. BalatroWebAPI uses it through a
# git tag (its pyproject.toml, [tool.uv.sources]); after a release, bump the
# tag there and run `uv lock` (see BalatroWebAPI's AGENTS.md).
#
# The differential tests against the original game (tests/test_oracle.py) need
# LuaJIT and the game's source, which can't be in CI: they are skipped here.
# The golden runs (tests/vectors) recorded from the game still run. Run the
# oracle tests locally before a release (docs/verification.md).
name: CI/CD

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tests (Python ${{ matrix.python }}), ruff
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m "not slow"
      - run: uv run ruff check .

  build:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv build
      - name: The wheel has the game data
        run: |
          python3 - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          data = [n for n in names if n.startswith("balatro/data/") and n.endswith(".json")]
          assert data, "no balatro/data/*.json in the wheel"
          print("data files:", data)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: GitHub release
    needs: [check, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the package's version
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not pyproject.toml's version (v$version)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
